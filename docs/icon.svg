<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.1" />
      <stop offset="25%" stop-color="#f87171" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="75%" stop-color="#f87171" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.1" />
    </linearGradient>
    <filter id="laserGlow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="#334155" stroke-width="4" opacity="0.6" />

  <!-- Package / Cargo Symbol -->
  <g transform="translate(106, 80)">
    <!-- Box Body -->
    <rect x="20" y="30" width="260" height="230" rx="20" fill="#1e293b" stroke="url(#amberGrad)" stroke-width="8" />

    <!-- Barcode Stripes -->
    <rect x="52" y="65" width="14" height="100" rx="3" fill="#f8fafc" />
    <rect x="76" y="65" width="8" height="100" rx="2" fill="#f8fafc" />
    <rect x="94" y="65" width="20" height="100" rx="3" fill="#f8fafc" />
    <rect x="124" y="65" width="10" height="100" rx="2" fill="#f8fafc" />
    <rect x="144" y="65" width="22" height="100" rx="3" fill="#f8fafc" />
    <rect x="176" y="65" width="12" height="100" rx="2" fill="#f8fafc" />
    <rect x="198" y="65" width="20" height="100" rx="3" fill="#f8fafc" />
    <rect x="228" y="65" width="14" height="100" rx="3" fill="#f8fafc" />

    <!-- Scanner Target Bracket Corners -->
    <path d="M 0 50 L 0 10 L 40 10" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 300 50 L 300 10 L 260 10" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 0 240 L 0 280 L 40 280" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 300 240 L 300 280 L 260 280" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Red Laser Beam Line -->
    <line x1="-15" y1="115" x2="315" y2="115" stroke="url(#laserGrad)" stroke-width="6" filter="url(#laserGlow)" />
  </g>

  <!-- Return Circular Badge with Arrow -->
  <g transform="translate(256, 385)">
    <circle r="68" fill="#047857" stroke="#10b981" stroke-width="6" />
    <!-- Return Arrow Symbol -->
    <path d="M -30 -10 A 38 38 0 1 1 -20 26" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" />
    <polygon points="-38,-26 -14,-10 -38,6" fill="#ffffff" />
    <!-- Mini Checkmark in Center -->
    <path d="M -12 4 L -2 14 L 18 -6" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
